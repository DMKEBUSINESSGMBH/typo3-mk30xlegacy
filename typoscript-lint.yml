paths:
  - Configuration
filePatterns:
  - "*.typoscript"
  - "*.tsconfig"
  - "*.tss"
  - "*.tsc"
sniffs:
  - class: Indentation
    parameters:
      useSpaces: true
      indentPerLevel: 4
      indentConditions: true

  - class: DeadCode
  - class: OperatorWhitespace
  - class: RepeatingRValue
  - class: DuplicateAssignment
  - class: EmptySection
